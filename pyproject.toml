[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "solenoid-calculator"
version = "0.1.0"
description = "Scientific calculation core for thick cylindrical solenoids"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Michael P. Adams" }]
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
web = [
  "shiny>=1.8,<2",
  "shinylive==0.8.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solenoid_calculator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
exclude = ["src/app.py"]
